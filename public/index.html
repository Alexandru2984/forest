<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta name="theme-color" content="#030808">
    <title>Code Forest — Interactive 3D GitHub Visualizer</title>
    <meta name="description" content="Transform any GitHub profile into a thriving, bioluminescent 3D digital forest. Visualize repositories, commits, and languages in real-time WebGL.">
    <link rel="canonical" href="https://forest.micutu.com/">

    <!-- Open Graph -->
    <meta property="og:title" content="Code Forest — Interactive 3D GitHub Visualizer">
    <meta property="og:description" content="Transform any GitHub profile into a bioluminescent 3D digital forest with real-time WebGL rendering.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://forest.micutu.com">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Code Forest — Interactive 3D GitHub Visualizer">
    <meta name="twitter:description" content="Transform any GitHub profile into a bioluminescent 3D digital forest with real-time WebGL rendering.">

    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌲</text></svg>">
    <link rel="stylesheet" href="/css/style.css">

    <!-- Self-hosted three.js r150 (no CDN / no supply-chain risk) via native import map -->
    <script type="importmap">
      {
        "imports": {
          "three": "/vendor/three/build/three.module.js",
          "three/addons/": "/vendor/three/examples/jsm/"
        }
      }
    </script>
    <script defer src="https://analytics.micutu.com/script.js" data-website-id="d5b0f7b7-e6d0-4405-8a76-8dff603f6851"></script>
</head>
<body>
    <!-- Loading splash -->
    <div id="loading-screen">
        <div class="loading-icon">🌲</div>
        <div class="loading-title">CODE_FOREST</div>
        <div class="loading-subtitle">INITIALIZING WEBGL RENDERER…</div>
        <div class="loading-bar"><div class="loading-bar-fill"></div></div>
    </div>

    <div id="ui-layer">
        <div class="top-bar">
            <div class="top-left">
                <h1 id="main-title">🌲 CODE_FOREST</h1>
                <p class="subtitle" id="sub-title">v9.0.0 // SELF-HOSTED · FULL HISTORY · FILTERS</p>

                <!-- Filter Controls -->
                <div id="filter-panel" class="glass-panel">
                    <div>
                        <label for="filter-lang">Lang</label>
                        <select id="filter-lang" class="glass-input" aria-label="Filter by language">
                            <option value="">ALL</option>
                        </select>
                    </div>
                    <div>
                        <label for="filter-created">Created after</label>
                        <input type="date" id="filter-created" class="glass-input" aria-label="Created after date" />
                    </div>
                    <div>
                        <label for="filter-updated">Updated after</label>
                        <input type="date" id="filter-updated" class="glass-input" aria-label="Updated after date" />
                    </div>
                    <button id="filter-btn" class="glass-btn" type="button">Apply</button>
                </div>
            </div>

            <!-- Target User -->
            <div id="github-form" class="glass-panel">
                <label for="github-input">Target user</label>
                <input type="text" id="github-input" value="Alexandru2984" placeholder="e.g. torvalds" autocomplete="off" autocapitalize="off" spellcheck="false" class="glass-input" aria-label="GitHub username" />
                <label for="github-token">Token (opt)</label>
                <input type="password" id="github-token" placeholder="ghp_…" autocomplete="off" class="glass-input" aria-label="GitHub personal access token (optional)" />
                <button id="github-submit" class="glass-btn pulse-idle" type="button">Fetch</button>
            </div>
        </div>

        <div id="status" role="status" aria-live="polite">READY</div>
    </div>

    <!-- Camera controls (collapsible) -->
    <div id="controls-help">
        <div class="controls-toggle" id="controls-toggle" role="button" tabindex="0" aria-expanded="false" aria-controls="controls-body">
            <span class="chevron">▶</span> CAMERA CONTROLS
        </div>
        <div class="controls-body" id="controls-body">
            <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> Move &nbsp;·&nbsp; <kbd>Q</kbd><kbd>E</kbd> Up / Down<br>
            <kbd>Drag</kbd> Rotate &nbsp;·&nbsp; <kbd>Scroll</kbd> Zoom<br>
            <kbd>Hover</kbd> Inspect &nbsp;·&nbsp; <kbd>Click</kbd> Open commit
        </div>
    </div>

    <!-- Live stats -->
    <div id="stats-bar">
        <div class="stat-item"><span class="stat-label">Repos</span><span class="stat-value" id="stat-repos">0</span></div>
        <div class="stat-divider"></div>
        <div class="stat-item"><span class="stat-label">Commits</span><span class="stat-value" id="stat-commits">0</span></div>
        <div class="stat-divider"></div>
        <div class="stat-item"><span class="stat-label">Langs</span><span class="stat-value" id="stat-langs">0</span></div>
        <div class="stat-divider"></div>
        <div class="stat-item"><span class="stat-label">FPS</span><span class="stat-value" id="stat-fps">--</span></div>
    </div>

    <!-- Mobile: toggle the control panels to reveal the forest -->
    <button id="panel-toggle" class="icon-btn" type="button" aria-label="Toggle control panels" aria-pressed="false">☰</button>

    <!-- Mobile: on-screen movement joystick -->
    <div id="joystick" aria-hidden="true"><div class="joystick-knob"></div></div>

    <div id="tooltip" role="tooltip"></div>

    <script type="module" src="/js/app.js"></script>
</body>
</html>
