# =============================================================================
# Code Forest — sample nginx site config
# Serves the static frontend and reverse-proxies the API to the Go backend.
#
# Adjust:  server_name, root, ssl_certificate paths.
# This is a TEMPLATE — review before applying to a live host.
# =============================================================================

# --- Put this in the http{} context (e.g. /etc/nginx/conf.d/limits.conf) ---
#
#   limit_req_zone $binary_remote_addr zone=forest_api:10m rate=10r/s;
#
#   # Behind Cloudflare, prefer the real visitor IP for rate limiting / logs.
#   map $http_cf_connecting_ip $forest_real_ip {
#       default   $http_cf_connecting_ip;
#       ""        $remote_addr;
#   }

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name forest.micutu.com;

    # --- TLS (Let's Encrypt / certbot) ---
    ssl_certificate     /etc/letsencrypt/live/forest.micutu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/forest.micutu.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root  /var/www/code-forest/public;
    index index.html;

    # --- Security headers ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # CSP: self-hosted three.js + the inline import map (hashed) + self-hosted analytics.
    # NOTE: if you edit the <script type="importmap"> block in index.html, recompute
    # its sha256 (see deploy/README or `make csp-hash`) and update the hash below.
    add_header Content-Security-Policy "default-src 'self'; \
script-src 'self' https://analytics.micutu.com 'sha256-ptcTDe304+Ki37P+DVnUO0mL/0gN5861fr3xLREP4iQ='; \
style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; \
font-src 'self' https://fonts.gstatic.com; \
img-src 'self' data:; \
connect-src 'self' https://analytics.micutu.com; \
worker-src 'self' blob:; \
base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'none'" always;

    # --- Gzip ---
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # --- Static assets ---
    location / {
        try_files $uri $uri/ =404;
    }

    # Long-cache the immutable vendored libraries.
    location /vendor/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Never cache the HTML shell so deploys take effect immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # --- API reverse proxy -> Go backend (127.0.0.1:8089) ---
    location ~ ^/(api|github|health) {
        limit_req zone=forest_api burst=20 nodelay;

        proxy_pass http://127.0.0.1:8089;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $forest_real_ip;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 65s;
    }
}

# --- Redirect plain HTTP to HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name forest.micutu.com;
    return 301 https://$host$request_uri;
}
