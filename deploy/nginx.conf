# Install as /etc/nginx/sites-available/forest.micutu.com and enable its symlink.
# This VPS already defines $from_cloudflare_origin and trusted Cloudflare real IP
# handling in conf.d/cloudflare-{origin-guard,realip}.conf. Preserve those files.
# On a different host, configure authenticated edge trust before enabling this vhost.
limit_req_zone $binary_remote_addr zone=forest_api:10m rate=5r/s;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name forest.micutu.com;
    if ($from_cloudflare_origin = 0) { return 403; }

    ssl_certificate /etc/letsencrypt/live/forest.micutu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/forest.micutu.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:forest_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    client_max_body_size 1k;
    server_tokens off;

    # All static files and API responses come from one versioned Go binary.
    # Its CSP hashes the embedded import map and structured data automatically.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_set_header Host $host;
    # $remote_addr is already validated by this host's real-IP module.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header Forwarded "";
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_http_version 1.1;
    proxy_connect_timeout 3s;
    proxy_read_timeout 55s;
    proxy_send_timeout 10s;
    proxy_cache off;
    proxy_intercept_errors off;
    limit_req_status 429;

    location ~ /\. { return 404; }
    location /api/ {
        limit_req zone=forest_api burst=10 nodelay;
        proxy_pass http://127.0.0.1:8089;
    }
    location = /github {
        limit_req zone=forest_api burst=10 nodelay;
        proxy_pass http://127.0.0.1:8089;
    }
    location / { proxy_pass http://127.0.0.1:8089; }
}
server {
    listen 80;
    listen [::]:80;
    server_name forest.micutu.com;
    return 301 https://forest.micutu.com$request_uri;
}
