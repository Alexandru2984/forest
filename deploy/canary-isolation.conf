# Project-specific override for code-forest-canary.service on this VPS.
# Install under /etc/systemd/system/code-forest-canary.service.d/10-isolation.conf.
[Service]
DynamicUser=yes
User=code-forest
Group=code-forest
WorkingDirectory=/
Environment=GOMEMLIMIT=384MiB
Environment=GOMAXPROCS=2
TimeoutStopSec=35s
