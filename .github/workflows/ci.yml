name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Product, security and browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOMAXPROCS: "2"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - name: Install locked development dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Formatting, race tests, frontend logic and asset integrity
        run: make check
      - name: Source and dependency vulnerability scans
        run: make security
      - name: Install test browser
        run: npx playwright install --with-deps chromium --only-shell
      - name: Browser, responsive and accessibility tests
        run: npm run test:browser
      - name: Build standalone release
        run: make build
      - name: Keep browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-diagnostics
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
